[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaomega-reporter"
version = "0.1.0"
description = "Standalone Python reporting toolbox for AlphaOmega MER and LFP depth-to-target analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AlphaOmega Reporter contributors" }]
dependencies = [
  "h5py>=3.10",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pydantic>=2.6",
  "pypdf>=4.2",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29",
  "pytest>=8.0",
  "ruff>=0.4",
]
mpx = [
  "neo>=0.13",
]
spikeinterface = [
  "spikeinterface>=0.103",
]

[project.scripts]
ao-report = "alphaomega_reporter.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  "neuroomega-io",
  "Precision2_02_23_2024_AlphaOmega",
  "output",
  "tmp",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
"src/alphaomega_reporter/cli.py" = ["B008"]
